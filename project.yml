name: "PinNote"
options:
  bundleIdPrefix: com.pinnote
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.9"
targets:
  PinNote:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pinnote.app
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
    info:
      path: Info.plist
      properties:
        CFBundleName: "PinNote"
        CFBundleDisplayName: "PinNote"
        CFBundlePackageType: APPL
        CFBundleIconFile: "PinNote"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    postCompileScripts:
      - name: "Copy App Icon"
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/Resources/PinNote.icns" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/PinNote.icns"
        basedOnDependencyAnalysis: false
